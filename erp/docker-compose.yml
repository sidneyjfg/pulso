services:
  api:
    image: ${ERP_API_IMAGE:-ghcr.io/sua-org/pulso-erp-api:${ERP_VERSION:-0.1.0}}
    # Para build interno, comente a linha image acima e descomente:
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile.api
    container_name: erp-api
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-3333}:3333"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    image: ${ERP_WORKER_IMAGE:-ghcr.io/sua-org/pulso-erp-worker:${ERP_VERSION:-0.1.0}}
    # Para build interno, comente a linha image acima e descomente:
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile.worker
    container_name: erp-worker
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${ERP_WEB_IMAGE:-ghcr.io/sua-org/pulso-erp-web:${ERP_VERSION:-0.1.0}}
    # Para build interno, comente a linha image acima e descomente:
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile.web
    container_name: erp-web
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: erp-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis-data:
